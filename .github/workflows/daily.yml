name: Daily Market Cloud Auto Update

on:
  schedule:
    # 07:30 KST (UTC 22:30) - 미국장 마감 직후 및 국내장 개장 전 자동 실행
    - cron: '30 22 * * *'
    # 23:00 KST (UTC 14:00) - 국내장 마감 분석 및 야간 선물 개시 자동 실행
    - cron: '0 14 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 언제든 'Run workflow' 버튼 클릭 즉시 실행

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Scraper & Updater
        run: |
          python scripts/auto_update.py

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html daily_market_data.json
          git diff --staged --quiet || (git commit -m "chore(auto): daily market update $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" && git push)

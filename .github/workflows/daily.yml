name: Daily Market Cloud Auto Update

on:
  schedule:
    # 07:30 KST (UTC 22:30) - 뉴욕증시(나스닥) 마감 직후 및 국내장 개장 전 장전 시황 자동 갱신
    - cron: '30 22 * * *'
    # 15:40 KST (UTC 06:40) - 국내 증시 정규장 마감 직후 마감 시황 자동 갱신
    - cron: '40 6 * * *'
    # 23:00 KST (UTC 14:00) - 야간 나스닥 선물 및 외환 마감 자동 갱신
    - cron: '0 14 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Scraper & Updater
        run: |
          python scripts/auto_update.py

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html daily_market_data.json
          git diff --staged --quiet || (git commit -m "chore(auto): daily market update $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" && git push)
